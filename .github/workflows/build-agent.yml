name: Build Windows Agent

# Compiles the Windows endpoint agent on a Windows + MSYS2 runner (the same
# toolchain build.sh expects locally) and commits the built .exe + regenerated
# .sha256 back to the repo, so manage-windows-agent.ps1 keeps serving them unchanged.
#
# SAFETY:
#  * a compile failure or an undersized binary aborts BEFORE any commit, so a
#    broken build never replaces the working .exe;
#  * endpoints are NOT auto-updated — you still run manage-windows-agent.ps1 to deploy,
#    so you validate one box before rolling out (a bad build cannot reach the
#    fleet on its own);
#  * the exact binary is also uploaded as a run artifact for testing.
#
# The commit-back is made with GITHUB_TOKEN, which does NOT re-trigger workflows,
# and carries [skip ci]; combined with the source-only path filter this cannot
# loop.

on:
  push:
    branches: [main]
    paths:
      - 'agents/endpoint/windows/**.cpp'
      - 'agents/endpoint/windows/**.h'
      - 'agents/endpoint/windows/build.sh'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

concurrency:
  group: build-agent
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # commit the built binary back to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Compile agent (build.sh)
        shell: msys2 {0}
        run: |
          cd agents/endpoint/windows
          bash build.sh

      - name: Verify + regenerate sha256
        shell: msys2 {0}
        run: |
          cd agents/endpoint/windows
          test -f cybersentineldlp_agent.exe || { echo "::error::no .exe produced"; exit 1; }
          # build.sh makes timestamped backups when an old .exe exists — never commit those
          rm -f cybersentineldlp_agent.exe.backup.* 2>/dev/null || true
          size=$(stat -c%s cybersentineldlp_agent.exe)
          echo "built .exe size: ${size} bytes"
          [ "${size}" -gt 1000000 ] || { echo "::error::.exe too small (${size}B) — build likely broken"; exit 1; }
          sha256sum -b cybersentineldlp_agent.exe > cybersentineldlp_agent.exe.sha256
          cat cybersentineldlp_agent.exe.sha256

      - name: Upload build artifact (test before rollout)
        uses: actions/upload-artifact@v4
        with:
          name: cybersentineldlp_agent
          path: |
            agents/endpoint/windows/cybersentineldlp_agent.exe
            agents/endpoint/windows/cybersentineldlp_agent.exe.sha256
          retention-days: 30

      - name: Commit the built binary back to the repo
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/endpoint/windows/cybersentineldlp_agent.exe \
                  agents/endpoint/windows/cybersentineldlp_agent.exe.sha256
          if git diff --cached --quiet; then
            echo "agent binary unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "build(agent): CI-compiled binary + sha256 [skip ci]"
          git pull --rebase origin main
          git push origin main
