name: Build Windows Agent

# Compiles the Windows endpoint agent on a Windows + MSYS2 runner (the same
# toolchain build.sh expects locally) and commits the built .exe + regenerated
# .sha256 back to the repo, so manage-windows-agent.ps1 keeps serving them unchanged.
#
# SAFETY:
#  * a compile failure or an undersized binary aborts BEFORE any commit, so a
#    broken build never replaces the working .exe;
#  * endpoints are NOT auto-updated — you still run manage-windows-agent.ps1 to deploy,
#    so you validate one box before rolling out (a bad build cannot reach the
#    fleet on its own);
#  * the exact binary is also uploaded as a run artifact for testing.
#
# The commit-back is made with GITHUB_TOKEN, which does NOT re-trigger workflows,
# and carries [skip ci]; combined with the source-only path filter this cannot
# loop.

on:
  push:
    branches: [main]
    paths:
      - 'agents/endpoint/windows/**.cpp'
      - 'agents/endpoint/windows/**.h'
      - 'agents/endpoint/windows/build.sh'
      - 'agents/endpoint/windows/VERSION'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

concurrency:
  group: build-agent
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # commit the built binary back to the repo
      actions: write         # dispatch the image build (see the last step)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast, before spending a build: the agent source changed (that is the
      # only thing that triggers this workflow), so the version must change too.
      # Without this the bump is a habit, and a habit that is skipped once
      # produces two different binaries claiming the same version — which is the
      # exact confusion the version exists to prevent.
      - name: Require a VERSION bump
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd agents/endpoint/windows
          new=$(tr -d ' \t\r\n' < VERSION)
          stamp=cybersentineldlp_agent.exe.version
          if [ ! -f "$stamp" ]; then
            echo "no previous version stamp — first stamped build, accepting ${new}"
            exit 0
          fi
          old=$(tr -d ' \t\r\n' < "$stamp")
          echo "committed binary is v${old}; this build wants v${new}"
          if [ "$old" = "$new" ]; then
            echo "::error file=agents/endpoint/windows/VERSION::Agent source changed but VERSION is still ${new}. Bump agents/endpoint/windows/VERSION so this binary gets its own version number."
            exit 1
          fi

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Compile agent (build.sh)
        shell: msys2 {0}
        run: |
          cd agents/endpoint/windows
          bash build.sh

      # Authenticode signature.
      #
      # Runs BEFORE the checksum below, because signing rewrites the file - a
      # hash taken first would describe a binary nobody is ever sent.
      #
      # Skipped, loudly, when no certificate is configured. A build that fails
      # because a secret is missing would block every agent fix on an
      # administrative task, so an unsigned build still ships and says so.
      #
      # Timestamped: without it every signature, including on binaries already
      # deployed to endpoints, becomes invalid the day the certificate expires.
      - name: Sign the agent binary
        id: sign
        shell: pwsh
        env:
          PFX_B64:  ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          cd agents/endpoint/windows
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "::warning::CODE_SIGNING_PFX_BASE64 not set - shipping an UNSIGNED binary."
            Write-Host "::warning::Endpoints will rely on the SHA-256 sidecar alone, and Defender"
            Write-Host "::warning::may heuristically quarantine the unsigned exe."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'csdlp-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          try {
            $pw = ConvertTo-SecureString $env:PFX_PASS -AsPlainText -Force
            $cert = Get-PfxCertificate -FilePath $pfx -Password $pw
            $r = Set-AuthenticodeSignature -FilePath cybersentineldlp_agent.exe `
                   -Certificate $cert -HashAlgorithm SHA256 `
                   -TimestampServer 'http://timestamp.digicert.com'
            if ($r.Status -ne 'Valid') { throw "signing failed: $($r.Status) $($r.StatusMessage)" }
            Write-Host "signed by $($cert.Subject)"
            Write-Host "thumbprint $($cert.Thumbprint)"

            # The PUBLIC half, published so an endpoint can trust this publisher.
            # Exported from the same certificate that just signed, so the two can
            # never describe different keys.
            Export-Certificate -Cert $cert -FilePath csdlp-signing.cer -Type CERT | Out-Null
            $cert.Thumbprint | Out-File -FilePath csdlp-signing.thumbprint -Encoding ascii -NoNewline
            "signed=true" >> $env:GITHUB_OUTPUT
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            # Never leave a private key on the runner's disk.
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify + regenerate sha256
        shell: msys2 {0}
        run: |
          cd agents/endpoint/windows
          test -f cybersentineldlp_agent.exe || { echo "::error::no .exe produced"; exit 1; }
          # build.sh makes timestamped backups when an old .exe exists — never commit those
          rm -f cybersentineldlp_agent.exe.backup.* 2>/dev/null || true
          size=$(stat -c%s cybersentineldlp_agent.exe)
          echo "built .exe size: ${size} bytes"
          [ "${size}" -gt 1000000 ] || { echo "::error::.exe too small (${size}B) — build likely broken"; exit 1; }
          sha256sum -b cybersentineldlp_agent.exe > cybersentineldlp_agent.exe.sha256
          cat cybersentineldlp_agent.exe.sha256
          # Records which version the committed binary IS. Two readers: the bump
          # check above, and manage-windows-agent.ps1, which fetches this 6-byte
          # file to name the available version without pulling 4.8 MB of exe.
          tr -d ' \t\r\n' < VERSION > cybersentineldlp_agent.exe.version
          cat cybersentineldlp_agent.exe.version

      - name: Upload build artifact (test before rollout)
        uses: actions/upload-artifact@v4
        with:
          name: cybersentineldlp_agent
          path: |
            agents/endpoint/windows/cybersentineldlp_agent.exe
            agents/endpoint/windows/cybersentineldlp_agent.exe.sha256
            agents/endpoint/windows/cybersentineldlp_agent.exe.version
            agents/endpoint/windows/csdlp-signing.cer
            agents/endpoint/windows/csdlp-signing.thumbprint
          retention-days: 30

      - name: Commit the built binary back to the repo
        id: commitback
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/endpoint/windows/cybersentineldlp_agent.exe \
                  agents/endpoint/windows/cybersentineldlp_agent.exe.sha256 \
                  agents/endpoint/windows/cybersentineldlp_agent.exe.version \
                  agents/endpoint/windows/csdlp-signing.cer \
                  agents/endpoint/windows/csdlp-signing.thumbprint
          if git diff --cached --quiet; then
            echo "agent binary unchanged — nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(tr -d ' \t\r\n' < agents/endpoint/windows/cybersentineldlp_agent.exe.version)
          git commit -m "build(agent): v${ver} CI-compiled binary + sha256 [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The manager publishes this binary to endpoints at /api/v1/agent-dist, and
      # the image is seeded with it at build time. But the commit above carries
      # [skip ci] - correctly, or the image build would loop - so the image
      # workflow's push trigger does NOT fire here. Without this dispatch the
      # manager image would keep shipping the PREVIOUS agent until some unrelated
      # push happened to rebuild it, and a fresh deployment would hand endpoints
      # a stale binary while reporting success. Dispatch it explicitly instead.
      #
      # No loop: the image workflow commits nothing.
      - name: Rebuild the manager image so it ships this agent
        if: steps.commitback.outputs.committed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-images.yml --ref main
