name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repo-scoped path. The default GITHUB_TOKEN can ONLY push to packages
  # under ghcr.io/<owner>/<repo>/... — user-namespace pushes
  # (ghcr.io/<owner>/...) require a PAT with write:packages scope.
  # github.repository expands to "effaaykhan/cybersentineldlp-prod".
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: manager
            dockerfile: ./server/Dockerfile
            context: ./server
          - service: dashboard
            dockerfile: ./dashboard/Dockerfile
            context: ./dashboard
          - service: smtp-relay
            dockerfile: ./smtp-relay/Dockerfile
            context: ./smtp-relay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/dlp-${{ matrix.service }}
          # type=sha gives EVERY build an immutable, commit-addressed tag
          # (sha-a1b2c3d) that lives in the registry. Without it the only tag a
          # normal push produces is the moving `:latest`, which leaves `csdlp
          # rollback` with nothing to re-pull — it can only re-tag a local image
          # ID, so recovery dies the moment that image is pruned or you are on a
          # different host. The semver tags below only fire on a `v*` git tag.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
