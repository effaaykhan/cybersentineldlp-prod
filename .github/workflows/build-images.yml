name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repo-scoped path. The default GITHUB_TOKEN can ONLY push to packages
  # under ghcr.io/<owner>/<repo>/... — user-namespace pushes
  # (ghcr.io/<owner>/...) require a PAT with write:packages scope.
  # github.repository expands to "effaaykhan/cybersentineldlp-prod".
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: manager
            dockerfile: ./server/Dockerfile
            context: ./server
          - service: dashboard
            dockerfile: ./dashboard/Dockerfile
            context: ./dashboard
          - service: smtp-relay
            dockerfile: ./smtp-relay/Dockerfile
            context: ./smtp-relay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/dlp-${{ matrix.service }}
          # type=sha gives EVERY build an immutable, commit-addressed tag
          # (sha-a1b2c3d) that lives in the registry. Without it the only tag a
          # normal push produces is the moving `:latest`, which leaves `csdlp
          # rollback` with nothing to re-pull — it can only re-tag a local image
          # ID, so recovery dies the moment that image is pruned or you are on a
          # different host. The semver tags below only fire on a `v*` git tag.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # The manager publishes the Windows installer and agent binary to endpoints
      # at /api/v1/agent-dist (endpoints can no longer fetch them from GitHub -
      # the repository is private, and GitHub answers 404 to an anonymous
      # caller). The build context is ./server, so the artifacts have to be
      # copied inside it before the image is built. Seeding them here means a
      # fresh deployment can install agents before anyone has configured
      # AGENT_DIST_TOKEN; once that token is set the manager keeps the directory
      # current at runtime and this seed is only ever the starting point.
      - name: Seed agent artifacts into the manager image
        if: matrix.service == 'manager'
        run: |
          mkdir -p server/agent_dist
          cp manage-windows-agent.ps1 server/agent_dist/
          cp agents/endpoint/windows/cybersentineldlp_agent.exe \
             agents/endpoint/windows/cybersentineldlp_agent.exe.sha256 \
             agents/endpoint/windows/cybersentineldlp_agent.exe.version \
             server/agent_dist/
          # A binary that does not match its own sidecar would make every
          # endpoint report a tampered download. Fail the build instead.
          cd server/agent_dist
          sha256sum -c cybersentineldlp_agent.exe.sha256
          ls -l

      # Tesseract, for the OCR that reads a photographed ID card.
      #
      # The agent installer used to fetch this from Chocolatey, which downloads
      # its own installer and, on Windows Server, pulls .NET 4.8 before it will
      # run at all. Both fail on a machine with no internet - so OCR was lost on
      # exactly the fleet most likely to be isolated, and the operator saw a .NET
      # error with no obvious bearing on DLP. Staging it by hand on every manager
      # fixed that and was a step everyone forgot; baking it here means an
      # endpoint gets OCR from the server it already talks to, with nothing
      # configured and no internet at either end.
      #
      # Pulled from the tesseract-ocr project's own GitHub release, not the
      # UB-Mannheim mirror the docs point at: the mirror answers 403 to
      # non-browser clients, which is not something to put in a build.
      #
      # The checksum is PINNED. Endpoints run this installer elevated and
      # silently, so a mirror serving something unexpected must not be baked
      # into an image that hundreds of machines then fetch it from. A mismatch
      # drops the file and builds without it - the installer falls back to
      # Chocolatey exactly as it did before - rather than failing the build of
      # a manager image over an optional dependency.
      - name: Seed the OCR dependency into the manager image
        if: matrix.service == 'manager'
        env:
          TESS_URL: https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe
          TESS_SHA: bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4
        run: |
          out=server/agent_dist/tesseract-installer.exe
          if ! curl -fL --retry 3 --retry-delay 5 --max-time 600 -o "$out" "$TESS_URL"; then
            echo "::warning::Could not download Tesseract; endpoints will fall back to Chocolatey"
            rm -f "$out"
            exit 0
          fi
          if ! echo "$TESS_SHA  $out" | sha256sum -c -; then
            echo "::warning::Tesseract checksum mismatch - refusing to ship it"
            rm -f "$out"
            exit 0
          fi
          ls -l "$out"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
