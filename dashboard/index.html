<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      This pointed at /vite.svg, which has never existed in public/ — so every
      tab showed the browser's default globe. Sizes are shipped in one .ico
      because browsers pick different ones: 16 for the tab, 32 for the bookmark
      bar, 48 for a Windows shortcut. The icon is cropped to the shield alone;
      the logo's circuit "wings" span the full width but are a few pixels tall,
      so squaring the whole artwork shrinks the shield to half the frame and it
      turns to a smudge at 16px.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy is also set by nginx in dashboard/nginx.conf,
      but mirroring it as a <meta> tag means the policy is enforced even
      when the SPA is served by `vite preview`, `npm start`, a developer
      machine, or any deployment that does not front the build with this
      exact nginx config. Without this, an XSS during dev would have full
      power.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>CyberSentinel DLP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
