# ─── Rate limit zones (must be declared at http{} scope, which nginx's
#     default /etc/nginx/nginx.conf already opens for any conf.d/*.conf
#     included file. These are global per-IP limiters applied inside the
#     location blocks in snippets/dashboard-app.conf.)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# WebSocket upgrade passthrough helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hide the nginx version banner
server_tokens off;

# ─── HTTPS edge (TLS 1.3 + HTTP/2) on container port 3000 ─────────────────
# Single hardened front for the dashboard SPA and the browser-facing REST API
# proxy (requirement DLP-027). TLS is served on the SAME port the portal has
# always used: the host publishes container 3000 as :3023, so the dashboard is
# reached at https://<host>:3023 — there is no separate HTTPS port. nginx runs
# as the unprivileged `nginx` user, and 3000 is non-privileged, so it binds it
# directly.
#
# Certificates live at /etc/nginx/ssl/{fullchain,privkey}.pem:
#   * production: bind-mount real certs there (see docker-compose.prod.yml);
#   * otherwise:  the container entrypoint drops a self-signed pair on first
#                 start so TLS always works out of the box (replace for prod).
#
# TLS termination is browser↔nginx only; nginx still proxies to the manager
# over plain HTTP/1.1 on the internal Docker network (normal edge-termination).
# The endpoint agents are unaffected — they talk directly to manager:55000 and
# never pass through this listener.
server {
    listen 3000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # TLS 1.3 enabled; 1.2 kept as a compatibility fallback; 1.0/1.1 refused.
    # For a strict TLS-1.3-only posture, drop TLSv1.2 from this line.
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.3 cipher selection is client-driven; the list below only governs
    # the TLS 1.2 fallback (Mozilla "intermediate"). TLS 1.3 suites are fixed
    # in the protocol and always enabled.
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A plain-HTTP request that lands on this TLS port (e.g. an old
    # http://<host>:3023 bookmark) makes nginx raise error 497 — redirect it to
    # HTTPS on the same host:port the browser used ($http_host preserves :3023),
    # so existing http:// links keep working instead of erroring.
    error_page 497 =301 https://$http_host$request_uri;

    # HSTS — honored by browsers only once a *trusted* cert is in place; it is
    # ignored while the self-signed default cert is served, so it can never lock
    # you out before you install a real cert.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/dashboard-app.conf;
}
